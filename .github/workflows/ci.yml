name: RedisPal CI and Release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: redispal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.event.deleted != true
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    env:
      REDIS_TEST_ADDR: 127.0.0.1:6379
      REDIS_TEST_PASSWORD: redispal-ci-fixture
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.x'
      - name: Read the version from the pushed tag
        id: version
        if: github.ref_type == 'tag' && github.event.created
        run: node .github/scripts/release-version.mjs
      - name: Test release tag validation and the Vue frontend
        run: |
          node --test .github/scripts/release-version.test.mjs
          npm --prefix frontend ci
          npm --prefix frontend test
      - name: Test the Redis service against Redis
        shell: bash
        run: |
          docker run --rm -d --name redispal-ci -p 127.0.0.1:6379:6379 redis:8.2.1-alpine \
            redis-server --save "" --appendonly no --requirepass "$REDIS_TEST_PASSWORD"
          trap 'docker stop redispal-ci >/dev/null' EXIT
          for attempt in {1..30}; do
            if docker exec -e REDISCLI_AUTH="$REDIS_TEST_PASSWORD" redispal-ci redis-cli ping | grep -qx PONG; then
              go test -race ./internal/redisdesk
              exit
            fi
            sleep 1
          done
          echo "Redis did not become ready" >&2
          exit 1

  windows:
    runs-on: windows-latest
    needs: test
    if: github.ref_type == 'tag' && github.event.created
    env:
      APP_VERSION: ${{ needs.test.outputs.version }}
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.x'
      - name: Prepare NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'nsis-3.13.zip'
          curl.exe --fail --location --retry 3 --max-time 90 --silent --show-error 'https://downloads.sourceforge.net/project/nsis/NSIS%203/3.13/nsis-3.13.zip' -o $archive
          if ($LASTEXITCODE -ne 0) { throw 'Could not download NSIS' }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne 'BA63DFFC4410EE89193E1CB5A41989991BD77C61068DA17E3156D136B7B0B3D8') {
            throw 'NSIS archive checksum mismatch'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP -Force
          Join-Path $env:RUNNER_TEMP 'nsis-3.13' | Add-Content -LiteralPath $env:GITHUB_PATH
      - name: Build Windows x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path release | Out-Null
          ./build.ps1 -AppVersion $env:APP_VERSION -Installer
          Copy-Item -LiteralPath bin/RedisPal.exe -Destination release/RedisPal-windows-x64.exe
          Copy-Item -LiteralPath bin/RedisPal-windows-x64-setup.exe -Destination release/RedisPal-windows-x64-setup.exe
      - name: Test the Windows application and release checker
        run: go test ./...
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: RedisPal-${{ needs.test.outputs.tag }}-windows-x64
          path: |
            release/RedisPal-windows-x64.exe
            release/RedisPal-windows-x64-setup.exe
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [test, windows]
    if: github.ref_type == 'tag' && github.event.created
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.test.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: RedisPal-${{ needs.test.outputs.tag }}-windows-x64
          path: release
      - name: Publish the tested build against its existing tag
        shell: bash
        run: |
          git fetch --no-tags origin "refs/tags/$TAG"
          if [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$(git rev-parse HEAD)" ]]; then
            echo "The remote tag no longer points to the built commit." >&2
            exit 1
          fi
          cd release
          binaries=(RedisPal-windows-x64.exe RedisPal-windows-x64-setup.exe)
          sha256sum "${binaries[@]}" > SHA256SUMS
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$draft" == 'true' ]]; then
              gh release upload "$TAG" "${binaries[@]}" SHA256SUMS --clobber
              gh release edit "$TAG" --draft=false
            fi
          else
            gh release create "$TAG" "${binaries[@]}" SHA256SUMS \
              --verify-tag --title "RedisPal $TAG" --generate-notes
          fi
