name: RedisPal CI and Release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: redispal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    env:
      REDIS_TEST_ADDR: 127.0.0.1:6379
      REDIS_TEST_PASSWORD: redispal-ci-fixture
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.x'
      - name: Determine the release version
        id: version
        run: node .github/scripts/release-version.mjs
      - name: Test the version planner and Vue frontend
        run: |
          node --test .github/scripts/release-version.test.mjs
          npm --prefix frontend ci
          npm --prefix frontend test
      - name: Test the Redis service against Redis
        shell: bash
        run: |
          docker run --rm -d --name redispal-ci -p 127.0.0.1:6379:6379 redis:8.2.1-alpine \
            redis-server --save "" --appendonly no --requirepass "$REDIS_TEST_PASSWORD"
          trap 'docker stop redispal-ci >/dev/null' EXIT
          for attempt in {1..30}; do
            if docker exec -e REDISCLI_AUTH="$REDIS_TEST_PASSWORD" redispal-ci redis-cli ping | grep -qx PONG; then
              go test -race ./internal/redisdesk
              exit
            fi
            sleep 1
          done
          echo "Redis did not become ready" >&2
          exit 1

  windows:
    runs-on: windows-latest
    needs: test
    env:
      APP_VERSION: ${{ needs.test.outputs.version }}
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.x'
      - name: Build Windows x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path release | Out-Null
          ./build.ps1 -AppVersion $env:APP_VERSION
          Copy-Item -LiteralPath bin/RedisPal.exe -Destination release/RedisPal-windows-x64.exe
      - name: Test the Windows application and release checker
        run: go test ./...
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: RedisPal-${{ needs.test.outputs.tag }}-windows-x64
          path: release/RedisPal-windows-x64.exe
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [test, windows]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.test.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: RedisPal-${{ needs.test.outputs.tag }}-windows-x64
          path: release
      - name: Tag the tested commit and publish the release
        shell: bash
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            echo "A newer commit is on main. This build will not be published."
            exit 0
          fi
          cd release
          binary=RedisPal-windows-x64.exe
          sha256sum "$binary" > SHA256SUMS
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            [[ "$(git rev-list -n 1 "refs/tags/$TAG")" == "$GITHUB_SHA" ]]
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              --field "ref=refs/tags/$TAG" --field "sha=$GITHUB_SHA" >/dev/null
          fi
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$draft" == 'true' ]]; then
              gh release upload "$TAG" "$binary" SHA256SUMS --clobber
              gh release edit "$TAG" --draft=false --latest
            fi
          else
            gh release create "$TAG" "$binary" SHA256SUMS \
              --verify-tag --title "RedisPal $TAG" --generate-notes --latest
          fi
